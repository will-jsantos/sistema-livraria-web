{% extends 'base.html' %}{% block content %}<section class="card"><h1>Cadastrar livro</h1><form method="post"><div class="grid"><div><label for="isbn">ISBN</label><input id="isbn" name="isbn" required></div><div><label for="titulo">Título</label><input id="titulo" name="titulo" required minlength="2"></div><div><label for="autor">Autor</label><input id="autor" name="autor" required minlength="2"></div><div><label for="preco">Preço (ex.: 49,90)</label><input id="preco" name="preco" required></div><div><label for="quantidade">Quantidade inicial</label><input id="quantidade" name="quantidade" type="number" min="0" max="100000" required></div></div><p><button>Cadastrar</button></p></form></section>{% endblock %}
